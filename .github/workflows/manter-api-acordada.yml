# Mantém a API do Render acordada. No plano grátis ela dorme após 15 min sem uso
# e o primeiro acesso depois disso leva ~1 min. Este ping a cada 10 min evita isso.
# Fica neste repo (público) porque aqui os minutos de Actions são ilimitados;
# no repo da API (privado) o ping gastaria mais que a cota grátis.
# Ligada 24h a API usa ~720 h/mês, dentro das 750 h grátis do Render.
name: Manter API acordada

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar /actuator/health
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 30 -o /dev/null \
              -w "HTTP %{http_code} em %{time_total}s\n" \
              https://sulbiologic-hub-api.onrender.com/actuator/health; then exit 0; fi
            echo "API ainda acordando ($i)..."; sleep 15
          done
          echo "API não respondeu"; exit 1
