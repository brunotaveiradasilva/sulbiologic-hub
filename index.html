<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Barra do sistema (Android/iOS) com a cor do fundo da tela, como nos apps; no escuro, o quase preto. -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)" />
    <!-- Instalável na tela inicial: abre em tela cheia, sem a barra do navegador. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SulBiologic" />
    <meta name="description" content="SulBiologic Hub: metas por fornecedor e representante, e checklist." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icone.svg" />
    <title>SulBiologic Hub</title>
    <!-- Tema escolhido no menu da conta (src/shared/tema.ts), aplicado antes de desenhar pra não piscar. -->
    <script>
      try {
        var t = localStorage.getItem('sulbiologic-hub:tema')
        if (t === 'claro' || t === 'escuro') {
          document.documentElement.dataset.theme = t === 'escuro' ? 'dark' : 'light'
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = t === 'escuro' ? '#0A0A0A' : '#FFFFFF' })
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
